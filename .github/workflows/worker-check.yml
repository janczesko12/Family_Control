name: Cloudflare Worker check

on:
  pull_request:
    paths:
      - "workers/**"
  push:
    branches: [main]
    paths:
      - "workers/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: workers
        run: npm install
      - name: TypeScript check
        working-directory: workers
        run: npm run typecheck
